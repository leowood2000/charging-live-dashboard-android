plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leowood.chargingdashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.leowood.chargingdashboard"
        minSdk 28
        targetSdk 34
        versionCode 22
        versionName "0.8.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯系统 API：WebView + org.json，无第三方依赖
}
